<!-- Register Modal -->
<div id="registerModal" class="modal">
  <div class="modal-background"></div>
  <div class="modal-card">
    <header class="modal-card-head">
      <p class="modal-card-title">Register</p>
      <button
        class="delete"
        aria-label="close"
        onclick="closeModal('registerModal')"
      ></button>
    </header>
    <form method="post" action="{% url 'register' %}" id="registerForm">
      {% csrf_token %}
      <section class="modal-card-body">
        <div class="field">
          <label class="label">Full Name</label>
          <div class="control">
            <input
              class="input"
              type="text"
              name="username"
              placeholder="Enter your full name"
              required
            />
          </div>
        </div>
        <div class="field">
          <label class="label">Email</label>
          <div class="control">
            <input
              class="input"
              type="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>
        </div>
        <div class="field">
          <label class="label">Password</label>
          <div class="control">
            <input
              class="input"
              type="password"
              name="password"
              placeholder="Create a password"
              required
            />
          </div>
        </div>
        <div class="field">
          <label class="label">Confirm Password</label>
          <div class="control">
            <input
              class="input"
              type="password"
              name="confirm_password"
              placeholder="Confirm your password"
              required
            />
          </div>
        </div>
      </section>
      <footer class="modal-card-foot" style="justify-content: flex-end">
        <button
          class="button"
          type="button"
          onclick="closeModal('registerModal')"
        >
          Cancel
        </button>
        <button class="button is-success" type="submit">Register</button>
      </footer>
    </form>
  </div>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal">
  <div class="modal-background"></div>
  <div class="modal-card">
    <header class="modal-card-head">
      <p class="modal-card-title">Login</p>
      <button
        class="delete"
        aria-label="close"
        onclick="closeModal('loginModal')"
      ></button>
    </header>
    <form method="post" action="{% url 'login' %}" id="loginForm">
      {% csrf_token %}
      <section class="modal-card-body">
        <div class="field">
          <label class="label">Username</label>
          <div class="control">
            <input
              class="input"
              type="text"
              name="username"
              placeholder="Enter your username"
              required
            />
          </div>
        </div>
        <div class="field">
          <label class="label">Password</label>
          <div class="control">
            <input
              class="input"
              type="password"
              name="password"
              placeholder="Enter your password"
              required
            />
          </div>
        </div>
        <div class="has-text-right mt-2">
          <a
            href="#"
            onclick="
              openModal('forgotPasswordModal');
              return false;
            "
            style="color: #2f855a"
            >Forgot Password?</a
          >
        </div>
        <p class="has-text-centered mt-3">
          Don't have an account?
          <a
            href="#"
            onclick="
              openModal('registerModal');
              closeModal('loginModal');
              return false;
            "
            style="color: #2f855a"
            >Register</a
          >
        </p>
      </section>
      <footer class="modal-card-foot" style="justify-content: flex-end">
        <button class="button" type="button" onclick="closeModal('loginModal')">
          Cancel
        </button>
        <button class="button is-success" type="submit">Login</button>
      </footer>
    </form>
  </div>
</div>

<!-- Reset Password Modal (Enter new password) -->
<div id="resetPasswordModal" class="modal">
  <div class="modal-background"></div>
  <div class="modal-card">
    <header class="modal-card-head">
      <p class="modal-card-title">Set New Password</p>
      <button
        class="delete"
        onclick="closeModal('resetPasswordModal')"
      ></button>
    </header>
    <form
      method="post"
      action="{% url 'password_reset_confirm' %}"
      id="resetPasswordForm"
    >
      {% csrf_token %}
      <input type="hidden" name="uidb64" id="resetUidb64" />
      <input type="hidden" name="token" id="resetToken" />
      <section class="modal-card-body">
        <div class="field">
          <label class="label">New Password</label>
          <div class="control">
            <input
              class="input"
              type="password"
              name="password"
              placeholder="Enter new password"
              required
            />
          </div>
        </div>
        <div class="field">
          <label class="label">Confirm Password</label>
          <div class="control">
            <input
              class="input"
              type="password"
              name="confirm_password"
              placeholder="Confirm new password"
              required
            />
          </div>
        </div>
      </section>
      <footer class="modal-card-foot" style="justify-content: flex-end">
        <button
          class="button"
          type="button"
          onclick="closeModal('resetPasswordModal')"
        >
          Cancel
        </button>
        <button class="button is-success" type="submit">Reset Password</button>
      </footer>
    </form>
  </div>
</div>

  <div class="modal-background"></div>
  <div class="modal-card">
    <header class="modal-card-head">
      <p class="modal-card-title">Reset Password</p>
      <button
        class="delete"
        onclick="closeModal('forgotPasswordModal')"
      ></button>
    </header>
    <!-- <div id="forgotStep1">
      <form method="post" action="{% url 'send_reset_code' %}">
        {% csrf_token %}
        <section class="modal-card-body">
          <div class="field">

    <div id="forgotStep1">
      <form method="post" action="{% url 'send_reset_code' %}">
        {% csrf_token %}
        <section class="modal-card-body">
          <div class="field">
            <label class="label">Email</label>
            <input class="input" type="email" name="email" required />
          </div>
          <div class="field">
            <label class="label">Username</label>
            <input
              class="input"
              type="text"
              name="username"
              placeholder="Your username"
              required
            />
          </div>
        </section>
        <footer class="modal-card-foot">
          <button
            class="button"
            type="button"
            onclick="closeModal('forgotPasswordModal')"
          >
            Cancel
          </button>
          <button class="button is-success" type="submit">Send Code</button>
        </footer>
      </form>
    </div>
    <div id="forgotStep2" style="display: none">
      <form method="post" action="{% url 'verify_reset_code' %}">
        {% csrf_token %}
        <section class="modal-card-body">
          <div class="field">
            <label class="label">Enter Code</label>
            <input
              class="input"
              type="text"
              name="code"
              placeholder="6-digit code"
              required
            />
          </div>
          <div class="field">
            <label class="label">New Password</label>
            <input class="input" type="password" name="password" required />
          </div>
          <div class="field">
            <label class="label">Confirm Password</label>
            <input
              class="input"
              type="password"
              name="confirm_password"
              required
            />
          </div>
        </section>
        <footer class="modal-card-foot">
          <button
            class="button"
            type="button"
            onclick="closeModal('forgotPasswordModal')"
          >
            Cancel
          </button>
          <button class="button is-success" type="submit">
            Reset Password
          </button>
        </footer>
      </form>
    </div>
  </div>
</div>
