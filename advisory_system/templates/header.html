<!-- templates/header.html -->
{% load static %}
<nav
  class="navbar is-white has-shadow"
  role="navigation"
  style="
    position: sticky;
    top: 0;
    z-index: 1000;
    min-height: 85px;
    background-color: white;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    padding: 0.25rem 0;
  "
>
  <div class="container">
    <div class="navbar-brand">
      <a
        class="navbar-item has-text-weight-bold is-size-4"
        href="/"
        style="color: #1e3a2f"
      >
        🌱 AgriSmart
      </a>
      <a
        role="button"
        class="navbar-burger"
        data-target="navMenu"
        aria-label="menu"
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </a>
    </div>

    <div id="navMenu" class="navbar-menu">
      <div class="navbar-start"></div>

      <!-- Center menu (desktop) -->
      <div
        class="navbar-start is-flex is-justify-content-center is-flex-grow-1 is-hidden-touch"
      >
        <a class="navbar-item custom-nav" href="{% url 'home' %}">Home</a>
        <a class="navbar-item custom-nav" href="{% url 'about' %}">About Us</a>
        <a class="navbar-item custom-nav" href="{% url 'features' %}"
          >Features</a
        >
        <a class="navbar-item custom-nav" href="{% url 'contact' %}"
          >Contact Us</a
        >
      </div>

      <!-- Mobile menu -->
      <div class="navbar-start is-hidden-desktop">
        <a class="navbar-item custom-nav" href="{% url 'home' %}">Home</a>
        <a class="navbar-item custom-nav" href="{% url 'about' %}">About Us</a>
        <a class="navbar-item custom-nav" href="{% url 'features' %}"
          >Features</a
        >
        <a class="navbar-item custom-nav" href="{% url 'contact' %}"
          >Contact Us</a
        >
      </div>

      <div class="navbar-end">
        <div class="navbar-item">
          <div class="buttons">
            <a
              class="button is-success is-light"
              href="{% url 'login' %}"
              style="border-radius: 40px; font-weight: 500"
              >Login</a
            >
            <a
              class="button is-success"
              href="{% url 'register' %}"
              style="
                background-color: #2f855a;
                border-radius: 40px;
                font-weight: 500;
              "
              >Register</a
            >
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<style>
  .navbar-item {
    padding-top: 1rem;
    padding-bottom: 1rem;
    font-weight: 500;
    transition: all 0.2s ease;
  }

  .custom-nav {
    font-weight: 600;
    margin: 0 0.2rem;
    border-radius: 40px;
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .custom-nav:hover {
    background-color: #2f855a;
    color: white !important;
    border-radius: 40px;
  }
</style>

<script>
  // Common JavaScript for navbar burger
  document.addEventListener("DOMContentLoaded", () => {
    const burgers = document.querySelectorAll(".navbar-burger");
    burgers.forEach((el) => {
      el.addEventListener("click", () => {
        const target = el.dataset.target;
        const menu = document.getElementById(target);
        el.classList.toggle("is-active");
        if (menu) menu.classList.toggle("is-active");
      });
    });
  });
</script>
